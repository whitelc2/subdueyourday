<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subdue Your Day</title>
<script type="module">
try{
  const app=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const dbm=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
  const a=app.initializeApp({apiKey:"AIzaSyCGoF9rG4ur7BznHO3oW8G06du2ueS8mA8",authDomain:"subdue-your-day-e019d.firebaseapp.com",databaseURL:"https://subdue-your-day-e019d-default-rtdb.firebaseio.com",projectId:"subdue-your-day-e019d",storageBucket:"subdue-your-day-e019d.firebasestorage.app",messagingSenderId:"258998985194",appId:"1:258998985194:web:5c6f6a80d6ea379140d293"});
  const db=dbm.getDatabase(a);
  window._fb={ready:true,
    set:(p,v)=>dbm.set(dbm.ref(db,p),v),
    get:async p=>{const s=await dbm.get(dbm.ref(db,p));return s.exists()?s.val():null}};
  window.dispatchEvent(new Event('fb-ready'));
}catch(e){console.warn('Firebase unavailable, using local storage',e)}
</script>
<style>
@font-face{font-family:'Baukasten';src:url('HomepageBaukastenBold.otf');font-display:swap}
@font-face{font-family:'Quincy';src:url('QuincyRegularOV678.ttf');font-display:swap}
:root{--terra:#CF592B;--red:#820000;--darkred:#7A1A20;--green:#284E04;--yellow:#F99C17;--blue:#2B458C;--parch:#EFE6D3;--ink:#3b1d1a;--line:#e0d3b8;--card:#fffdf8}
*{box-sizing:border-box;font-style:normal!important}
body{margin:0;font-family:'Quincy',Georgia,serif;color:var(--ink);background:linear-gradient(160deg,#ffffff 0%,#f0e7d4 100%);background-attachment:fixed;min-height:100vh;font-size:16px}
h1,h2,h3,h4,.hd{font-family:'Baukasten','Quincy',serif;font-weight:normal;margin:0}
header{display:flex;align-items:center;gap:14px;padding:16px 20px;flex-wrap:wrap}
header img{height:64px}
.brand{flex:1;min-width:200px}
.brand h1{font-size:26px;color:var(--darkred);text-transform:uppercase;letter-spacing:.04em}
.brand p{margin:2px 0 0;font-size:14px;color:var(--terra)}
#sync{font-size:12px;padding:4px 10px;border-radius:12px;background:var(--parch);color:var(--green)}
#sync.local{color:var(--terra)}
input,select,textarea,button{font-family:'Quincy',Georgia,serif;font-size:15px;color:var(--ink)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff}
textarea{width:100%;resize:vertical;min-height:54px}
button{cursor:pointer;border:none;border-radius:8px;padding:7px 13px;background:var(--terra);color:#fff}
button.ghost{background:transparent;color:var(--terra);border:1px solid var(--terra)}
button.sm{padding:3px 8px;font-size:13px}
button.x{background:transparent;color:var(--red);padding:3px 7px}
nav.tabs{display:flex;gap:6px;padding:0 20px;border-bottom:2px solid var(--line);flex-wrap:wrap}
nav.tabs button{background:transparent;color:var(--ink);border-radius:8px 8px 0 0;font-family:'Baukasten',serif;text-transform:uppercase;letter-spacing:.06em;padding:10px 18px}
nav.tabs button.on{background:var(--terra);color:#fff}
main{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
.page{display:none}.page.on{display:block}
.ptitle{color:var(--darkred);text-transform:uppercase;font-size:24px;letter-spacing:.05em;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(130,0,0,.06)}
.card>h3,.chead h3{color:var(--darkred);text-transform:uppercase;font-size:17px;letter-spacing:.05em}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.chead input.sec-name{font-family:'Baukasten',serif;color:var(--darkred);text-transform:uppercase;font-size:17px;border:1px dashed transparent;background:transparent;padding:2px 4px;flex:1;min-width:120px}
.chead input.sec-name:focus{border-color:var(--line);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.phase{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-left:6px solid var(--terra)}
.phase b{font-family:'Baukasten',serif;color:var(--darkred);text-transform:uppercase}
.item{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.item.done .lbl{text-decoration:line-through;color:#a08f80}
.item .chk{width:20px;height:20px;accent-color:var(--green)}
.item .lbl{flex:1;min-width:150px;border-color:transparent;background:transparent}
.item .lbl:focus,.item .tm:focus,.item .note:focus{border-color:var(--terra);background:#fff}
.item .tm{width:100px;border-color:transparent;background:transparent;padding:4px;font-size:13px;color:var(--blue)}
.item .note{width:130px;border-color:transparent;background:transparent;font-size:13px}
.item select{font-size:12px;padding:3px;max-width:105px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--parch);color:var(--green);text-transform:uppercase}
.addrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.addrow input[type=text],.addrow input:not([type]){flex:1;min-width:140px}
.empty{color:#a08f80;font-size:14px;padding:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.sug{background:#fff6e0;border-color:var(--yellow)}
.chip{display:inline-block;padding:3px 9px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:13px;background:#fff;user-select:none}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.bar{height:9px;background:var(--parch);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.water{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drop{width:30px;height:30px;border-radius:50%;border:2px solid var(--blue);background:#fff;cursor:pointer}
.drop.on{background:var(--blue)}
/* weekly */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:900px){.week{grid-template-columns:1fr}}
.wcol{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:140px}
.wcol.today{border:2px solid var(--terra)}
.wcol h4{font-size:14px;color:var(--darkred);text-transform:uppercase;cursor:pointer}
.wcol .mini{font-size:13px;padding:2px 0}
.pill{display:block;font-size:12px;padding:2px 6px;border-radius:6px;margin:3px 0;color:#fff;background:var(--blue)}
.pill.rec{background:var(--yellow);color:var(--ink)}
/* monthly */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mhead{text-align:center;font-family:'Baukasten',serif;color:var(--darkred);font-size:13px;text-transform:uppercase;padding:4px}
.mcell{min-height:92px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;overflow:hidden}
.mcell.blank{background:transparent;border:none;cursor:default}
.mcell.today{border:2px solid var(--terra)}
.mcell.sel{background:#fff1da;border:2px solid var(--darkred)}
.mcell .n{font-family:'Baukasten',serif;font-size:14px;color:var(--darkred)}
.mcell .pill{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--terra)}
@media(max-width:640px){.mcell{min-height:60px}.mcell .pill{font-size:10px;padding:1px 3px}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:9px 18px;border-radius:20px;display:none;z-index:9}
</style>
</head>
<body>
<header>
  <img src="syd-logo.png" alt="SYD" onerror="this.onerror=null;this.src='syd-logo.PNG'">
  <div class="brand"><h1>Subdue Your Day</h1><p>Plan with purpose. Live with intention.</p></div>
  <input type="date" id="syd-date">
  <span id="sync">Starting…</span>
</header>
<nav class="tabs">
  <button data-tab="daily" class="on">Daily</button>
  <button data-tab="weekly">Weekly</button>
  <button data-tab="monthly">Monthly</button>
  <button data-tab="wellness">Wellness</button>
</nav>
<main>
  <section id="page-daily" class="page on"></section>
  <section id="page-weekly" class="page"></section>
  <section id="page-monthly" class="page"></section>
  <section id="page-wellness" class="page"></section>
</main>
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const arr=x=>Array.isArray(x)?x:(x&&typeof x==='object'?Object.values(x):[]);
const TODAY=fmt(new Date());
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pretty=(s,o)=>parse(s).toLocaleDateString('en-US',o||{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)};
const K={day:'syd3_day_',settings:'syd3_settings',well:'syd3_well',cal:'syd3_cal',rec:'syd3_rec'};

/* ---------- storage (local first, Firebase sync, newest wins) ---------- */
function setSync(s){const e=$('#sync');e.className=s==='ok'?'':'local';e.textContent=s==='ok'?'Synced':s==='saving'?'Saving…':'Saved on this device'}
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  loc(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  async put(k,v){v._ts=Date.now();this.loc(k,v);setSync('saving');
    if(window._fb&&window._fb.ready){try{await window._fb.set('syd/'+k,v);setSync('ok')}catch(e){setSync('local')}}else setSync('local')},
  async load(k){const l=this.get(k);let r=null;
    if(window._fb&&window._fb.ready){try{r=await window._fb.get('syd/'+k)}catch(e){}}
    if(r&&(!l||(r._ts||0)>(l._ts||0))){this.loc(k,r);return r}return l}
};

/* ---------- state ---------- */
const DEF_SECTIONS=[{id:'work',label:'Work Tasks'},{id:'home',label:'Home Tasks'},{id:'client',label:'Client Tasks'},{id:'personal',label:'Personal Tasks'}];
const DEF_BLOCKS=[{id:'w1',label:'9a–12p',note:''},{id:'w2',label:'12p–3p',note:'~2:00p Lunch'},{id:'w3',label:'3p–6p',note:''},{id:'w4',label:'6p–9p',note:'~8:00p Dinner'}];
let settings={cycleStart:'2026-11-01',cycleLen:28,periodLen:7,waterGoal:8,sections:DEF_SECTIONS,blocks:DEF_BLOCKS,morningNote:'~7:30a Breakfast',v:2};
let well={goals:[],workouts:[],workoutTarget:3,books:[],bookTarget:12,bucket:[],bucketTarget:10,places:[],placeTypes:['Restaurant','Travel','Retreat','Other']};
let cal={events:[],cats:['Personal','Work','Home','Client']};
let rec={list:[]};
let day=newDay(),curDate=TODAY,tab='daily';
let weekStart=addDays(TODAY,-parse(TODAY).getDay());
let mon={y:parse(TODAY).getFullYear(),m:parse(TODAY).getMonth()},selDate=TODAY;
const collapsed={};

function newDay(){return{intention:'',verse:'',carry:'',gratitude:'',wins:'',water:0,tasks:[],dismissed:[],hiddenCarry:[],well:{energy:'',mood:'',symptoms:[]}}}
function normDay(d){const n=Object.assign(newDay(),d||{});n.tasks=arr(n.tasks);n.dismissed=arr(n.dismissed);n.hiddenCarry=arr(n.hiddenCarry);n.well=Object.assign({energy:'',mood:'',symptoms:[]},n.well||{});n.well.symptoms=arr(n.well.symptoms);return n}
function normSettings(s){const n=Object.assign({},settings,s||{});n.sections=arr(n.sections).length?arr(n.sections):DEF_SECTIONS;n.blocks=arr(n.blocks).length?arr(n.blocks):DEF_BLOCKS;
  if(!(s&&s.v>=2)){n.cycleStart='2026-11-01';n.v=2}
  if(!n.sections.some(x=>x.id==='personal'))n.sections.push({id:'personal',label:'Personal Tasks'});return n}
function normWell(w){const n=Object.assign({},well,w||{});['goals','workouts','books','bucket','places','placeTypes'].forEach(k=>n[k]=arr(n[k]));n.bucket.forEach(b=>b.subs=arr(b.subs));return n}
function normCal(c){const n=Object.assign({},cal,c||{});n.events=arr(n.events);n.events.forEach(e=>e.doneDates=arr(e.doneDates));n.cats=arr(n.cats).length?arr(n.cats):cal.cats;return n}

/* ---------- saving ---------- */
let saveT=null,dirty=false;
function saveDay(){dirty=true;store.loc(K.day+curDate,Object.assign({},day,{_ts:Date.now()}));setSync('saving');clearTimeout(saveT);saveT=setTimeout(flush,700)}
function flush(){if(!dirty)return;dirty=false;clearTimeout(saveT);store.put(K.day+curDate,day)}
const saveSettings=()=>store.put(K.settings,settings);
const saveWell=()=>store.put(K.well,well);
const saveCal=()=>store.put(K.cal,cal);
const saveRec=()=>store.put(K.rec,rec);
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

/* ---------- cycle ---------- */
function cycleDay(ds){const diff=Math.round((parse(ds)-parse(settings.cycleStart))/864e5);const L=settings.cycleLen||28;return((diff%L)+L)%L+1}
function phaseOf(ds){const d=cycleDay(ds),P=settings.periodLen||7;
  if(d<=P)return'Menstrual';if(d<=13)return'Follicular';if(d<=16)return'Ovulatory';return'Luteal'}
const PHASE_TIP={Menstrual:'Rest, reflect, gentle movement.',Follicular:'Fresh energy — start new things.',Ovulatory:'Peak energy — connect and communicate.',Luteal:'Wind down — finish and nest.'};

/* ---------- recurring + calendar logic ---------- */
function recMatches(r,ds){const d=parse(ds);if(r.start&&ds<r.start)return false;if(r.until&&ds>r.until)return false;return arr(r.days).map(Number).includes(d.getDay())}
function entriesFor(ds){const d=parse(ds);return cal.events.filter(e=>{if(!e.date)return false;
  if(e.repeat==='weekly')return ds>=e.date&&parse(e.date).getDay()===d.getDay();
  if(e.repeat==='monthly')return ds>=e.date&&parse(e.date).getDate()===d.getDate();
  return e.date===ds}).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
const catColor=c=>['#2B458C','#284E04','#CF592B','#7A1A20','#F99C17','#5b3a7a','#2d7a7a'][Math.max(0,cal.cats.indexOf(c))%7];
function dayData(ds){return ds===curDate?day:normDay(store.get(K.day+ds))}
function groupLabel(g){const s=settings.sections.find(x=>x.id===g);if(s)return s.label;return{morn:'Morning',eve:'Evening',block:'Time Blocks',well:'Wellness',other:'Other'}[g]||g}

/* ---------- daily rendering ---------- */
function moveSelect(t){
  let o='<option value="">Move to…</option><option value="morn">Morning MSB</option><option value="eve">Evening MSB</option>';
  settings.blocks.forEach(b=>o+=`<option value="${b.id}">Block ${esc(b.label)}</option>`);
  if(t.slot!=='sec')o+='<option value="sec">Back to list</option>';
  return `<select data-act="assign">${o}</select>`}
function taskRow(t){
  return `<div class="item${t.done?' done':''}" data-k="task" data-id="${t.id}">
  <input type="checkbox" class="chk" data-f="done" ${t.done?'checked':''}>
  <input class="lbl" data-f="t" value="${esc(t.t)}" placeholder="Task">
  <input type="time" class="tm" data-f="start" value="${esc(t.start)}" title="Start">
  <input type="time" class="tm" data-f="end" value="${esc(t.end)}" title="End">
  <input class="note" data-f="note" value="${esc(t.note)}" placeholder="note">
  ${moveSelect(t)}
  <button class="x sm" data-act="repeat" title="Repeat weekly">↺</button>
  <button class="x sm" data-act="up">▲</button><button class="x sm" data-act="down">▼</button>
  <button class="x sm" data-act="del">✕</button></div>`}
const listHTML=f=>{const l=day.tasks.filter(f);return l.length?l.map(taskRow).join(''):'<div class="empty">Nothing here yet.</div>'};
const addRow=(list,ph)=>`<div class="addrow" data-list="${list}"><input placeholder="${ph||'Add a task…'}"><button data-act="add">Add</button></div>`;

function carryItems(){const out=[],seen=new Set(day.tasks.map(t=>t.t.toLowerCase())),ids=settings.sections.map(s=>s.id);
  for(let i=1;i<=7;i++){const ds=addDays(curDate,-i),d=store.get(K.day+ds);if(!d)continue;
    arr(d.tasks).forEach(t=>{const key=(t.t||'').toLowerCase();
      if(!t.done&&t.t&&ids.includes(t.group)&&!t.recId&&!seen.has(key)&&!day.hiddenCarry.includes(key)){seen.add(key);out.push({t:t.t,group:t.group,from:ds})}})}
  return out}
function suggested(){return rec.list.filter(r=>recMatches(r,curDate)&&!day.tasks.some(t=>t.recId===r.id)&&!day.dismissed.includes(r.id))}

function renderDaily(){
  const ph=phaseOf(curDate),cd=cycleDay(curDate),el=$('#page-daily');
  const sug=suggested(),cr=carryItems(),evs=entriesFor(curDate);
  let h=`<h2 class="ptitle">${esc(pretty(curDate))}</h2>
  <div class="card phase"><div><b>${ph} phase</b> · Day ${cd} of ${settings.cycleLen}<br><small>${PHASE_TIP[ph]}</small></div>
  <div class="row"><small>Last cycle start</small><input type="date" id="cycle-start" value="${settings.cycleStart}"></div></div>
  <div class="card"><h3>Today's intention</h3><textarea data-day="intention" placeholder="What is your intention today?">${esc(day.intention)}</textarea>
  <div class="grid2" style="margin-top:8px"><div><h3 style="font-size:14px">Verse</h3><textarea data-day="verse">${esc(day.verse)}</textarea></div>
  <div><h3 style="font-size:14px">How will you carry this?</h3><textarea data-day="carry">${esc(day.carry)}</textarea></div></div></div>`;
  if(evs.length)h+=`<div class="card"><h3>On your calendar today</h3>${evs.map(e=>`<div class="item${e.doneDates.includes(curDate)?' done':''}"><input type="checkbox" class="chk" data-act="evdone" data-id="${e.id}" ${e.doneDates.includes(curDate)?'checked':''}><span class="lbl" style="flex:1">${esc(e.time?e.time+' · ':'')}${esc(e.title)}${e.notes?' — '+esc(e.notes):''}</span><span class="tag">${esc(e.cat)}</span></div>`).join('')}</div>`;
  if(sug.length)h+=`<div class="card sug"><div class="chead"><h3>Suggested for today</h3><button class="sm ghost" data-act="sug-all">Add all</button></div>${sug.map(r=>`<div class="item"><span class="lbl" style="flex:1">${esc(r.time?r.time+' · ':'')}${esc(r.name)}</span><span class="tag">${esc(groupLabel(r.group))}</span><button class="sm" data-act="sug-add" data-id="${r.id}">Add</button><button class="sm ghost" data-act="sug-skip" data-id="${r.id}">Skip today</button></div>`).join('')}</div>`;
  if(cr.length)h+=`<div class="card sug"><div class="chead"><h3>Carried forward</h3><button class="sm ghost" data-act="carry-all">Add all</button></div>${cr.map((c,i)=>`<div class="item"><span class="lbl" style="flex:1">${esc(c.t)}</span><span class="tag">${esc(groupLabel(c.group))}</span><button class="sm" data-act="carry-add" data-i="${i}">Add</button><button class="sm ghost" data-act="carry-hide" data-i="${i}">Hide</button></div>`).join('')}</div>`;
  h+=`<div class="grid2"><div class="card"><h3>Morning MSB</h3><small>${esc(settings.morningNote)}</small>${listHTML(t=>t.slot==='morn')}${addRow('morn','Add morning task…')}</div>
  <div class="card"><h3>Evening MSB</h3>${listHTML(t=>t.slot==='eve')}${addRow('eve','Add evening task…')}</div></div>`;
  h+=`<div class="card"><div class="chead"><h3>Time blocks</h3><button class="sm ghost" data-act="add-block">+ Block</button></div>`;
  settings.blocks.forEach(b=>{h+=`<div style="margin-bottom:10px"><div class="chead" data-bk="${b.id}"><input class="sec-name" data-bf="label" value="${esc(b.label)}"><input data-bf="note" value="${esc(b.note)}" placeholder="meal / note" style="width:150px">${b.custom?'<button class="x sm" data-act="del-block">✕</button>':''}</div>${listHTML(t=>t.slot===b.id)}${addRow('blk:'+b.id,'Add to this block…')}</div>`});
  h+='</div>';
  settings.sections.forEach(s=>{const c=collapsed[s.id];
    h+=`<div class="card"><div class="chead" data-sec="${s.id}"><button class="sm ghost" data-act="collapse">${c?'▸':'▾'}</button><input class="sec-name" data-sf="label" value="${esc(s.label)}">${s.custom?'<button class="x sm" data-act="del-section">✕</button>':''}</div>${c?'':listHTML(t=>t.slot==='sec'&&t.group===s.id)+addRow('sec:'+s.id)}</div>`});
  h+=`<div style="margin-bottom:14px"><button class="ghost" data-act="add-section">+ Add section</button></div>`;
  const goalOpts=well.goals.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');
  h+=`<div class="card"><h3>Wellness</h3><div class="row"><select id="goal-pick"><option value="">Pick a wellness goal…</option>${goalOpts}</select><button class="sm" data-act="goal-day">+ Add to day</button></div>${listHTML(t=>t.group==='well'&&t.slot==='sec')}</div>`;
  const drops=Array.from({length:settings.waterGoal},(_,i)=>`<span class="drop${i<day.water?' on':''}" data-act="drop" data-i="${i+1}"></span>`).join('');

  h+='</div>';
  // report
  const agg={};days.forEach(ds=>dayData(ds).tasks.forEach(t=>{const g=t.group||'other';agg[g]=agg[g]||{t:0,d:0};agg[g].t++;if(t.done)agg[g].d++}));

  <div><small>Bucket list: ${well.bucket.filter(b=>b.done).length} / ${well.bucketTarget}</small><div class="bar"><i style="width:${Math.min(100,well.bucket.filter(b=>b.done).length/Math.max(1,well.bucketTarget)*100)}%"></i></div></div>
  <div><small>Places visited: ${well.places.filter(p=>p.visited).length} / ${well.places.length}</small><div class="bar"><i style="width:${well.places.length?well.places.filter(p=>p.visited).length/well.places.length*100:0}%"></i></div></div></div></div>`;

function render(){({daily:renderDaily,weekly:renderWeekly,monthly:renderMonthly,wellness:renderWellness})[tab]()}
function showTab(t){tab=t;document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='page-'+t));render()}

/* ---------- day loading ---------- */
async function loadDay(ds){flush();curDate=ds;$('#syd-date').value=ds;
  let d=await store.load(K.day+ds);
  if(!d&&ds==='2026-04-06'){d={tasks:[
    {id:uid(),t:'Morning prayer & journaling',slot:'morn',group:'morn',done:false},
    {id:uid(),t:'Review client deliverables',slot:'sec',group:'client',done:false},
    {id:uid(),t:'Plan the week ahead',slot:'sec',group:'work',done:false},
    {id:uid(),t:'Tidy the kitchen',slot:'sec',group:'home',done:false},
    {id:uid(),t:'Evening wind-down',slot:'eve',group:'eve',done:false}]}}
  day=normDay(d);render()}
const switchDate=ds=>{if(ds)loadDay(ds)};

/* ---------- task helpers ---------- */
const mk=(o)=>Object.assign({id:uid(),t:'',done:false,slot:'sec',group:'other',start:'',end:'',note:''},o);
function addTo(list,text,extra){text=(text||'').trim();if(!text)return;
  let o={t:text};
  if(list==='morn'){o.slot='morn';o.group='morn'}
  else if(list==='eve'){o.slot='eve';o.group='eve'}
  else if(list.startsWith('blk:')){o.slot=list.slice(4);o.group='block'}
  else if(list.startsWith('sec:')){o.slot='sec';o.group=list.slice(4)}
  day.tasks.push(mk(Object.assign(o,extra||{})));saveDay();renderDaily()}
function bookmarkRec(r){day.tasks.push(mk({t:r.name,start:r.time||'',group:r.group,recId:r.id}))}

/* ---------- registry for editable rows ---------- */
const REG={task:{l:()=>day.tasks,s:saveDay},rec:{l:()=>rec.list,s:saveRec},ev:{l:()=>cal.events,s:saveCal},
  goal:{l:()=>well.goals,s:saveWell},workout:{l:()=>well.workouts,s:saveWell},book:{l:()=>well.books,s:saveWell},
  bucket:{l:()=>well.bucket,s:saveWell},place:{l:()=>well.places,s:saveWell}};
function rowItem(row){
  if(row.dataset.k==='sub'){const b=well.bucket.find(x=>x.id===row.dataset.parent);return b&&{it:b.subs.find(x=>x.id===row.dataset.id),save:saveWell,list:b.subs}}
  const R=REG[row.dataset.k];if(!R)return null;return{it:R.l().find(x=>x.id===row.dataset.id),save:R.s,list:R.l()}}

/* ---------- events ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.day){day[t.dataset.day]=t.value;saveDay();return}
  if(t.dataset.bf){const b=settings.blocks.find(x=>x.id===t.closest('[data-bk]').dataset.bk);b[t.dataset.bf]=t.value;saveSettings();return}
  if(t.dataset.sf){const s=settings.sections.find(x=>x.id===t.closest('[data-sec]').dataset.sec);s.label=t.value;saveSettings();return}
  const row=t.closest('[data-k]');
  if(row&&t.dataset.f&&t.type!=='checkbox'&&t.tagName!=='SELECT'){const r=rowItem(row);if(r&&r.it){r.it[t.dataset.f]=t.value;r.save()}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='syd-date'){switchDate(t.value);return}
  if(t.id==='cycle-start'){if(t.value){settings.cycleStart=t.value;saveSettings();renderDaily()}return}
  if(t.id==='water-goal'){settings.waterGoal=Math.max(1,Math.min(30,+t.value||8));saveSettings();renderDaily();return}
  if(t.id==='wk-target'){well.workoutTarget=+t.value||1;saveWell();return}
  if(t.id==='book-target'){well.bookTarget=+t.value||1;saveWell();return}
  if(t.id==='bucket-target'){well.bucketTarget=+t.value||1;saveWell();return}
  if(t.dataset.wf){day.well[t.dataset.wf]=t.value;saveDay();return}
  const row=t.closest('[data-k]');
  if(t.dataset.act==='assign'&&row){const tk=day.tasks.find(x=>x.id===row.dataset.id);const v=t.value;if(!tk||!v)return;
    if(v==='sec'){tk.slot='sec'}else{tk.slot=v}saveDay();renderDaily();return}
  if(row&&t.dataset.f&&(t.type==='checkbox'||t.tagName==='SELECT'||t.type==='date'||t.type==='time')){
    const r=rowItem(row);if(!r||!r.it)return;
    r.it[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;
    if(t.type==='checkbox'&&row.dataset.k==='bucket'&&t.checked&&r.it.subs)r.it.subs.forEach(s=>s.done=true);
    r.save();if(t.type==='checkbox'||row.dataset.k==='rec'||row.dataset.k==='ev'||t.dataset.f==='status')render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const ar=e.target.closest('.addrow');if(ar){e.preventDefault();const b=ar.querySelector('button[data-act]');b&&b.click()}}});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;const a=el.dataset.act,row=el.closest('[data-k]');
  const rowIdx=()=>{const r=rowItem(row);return r&&{r,i:r.list.indexOf(r.it)}};
  switch(a){
  case'add':{const ar=el.closest('.addrow'),inp=ar.querySelector('input');addTo(ar.dataset.list,inp.value);break}
  case'save-now':flush();toast('Saved');break;
  case'end-day':flush();loadDay(addDays(curDate,1));break;
  case'del':{day.tasks=day.tasks.filter(t=>t.id!==row.dataset.id);saveDay();renderDaily();break}
  case'up':case'down':{const x=rowIdx();if(!x)break;const j=x.i+(a==='up'?-1:1);if(j<0||j>=x.r.list.length)break;
    const L=x.r.list;[L[x.i],L[j]]=[L[j],L[x.i]];x.r.save();render();break}
  case'repeat':{const t=day.tasks.find(x=>x.id===row.dataset.id);const g=settings.sections.some(s=>s.id===t.group)?t.group:'personal';
    rec.list.push({id:uid(),name:t.t,time:t.start||'',group:g,days:[parse(curDate).getDay()],start:curDate});saveRec();toast('Repeats weekly on '+DOW[parse(curDate).getDay()]+' — edit it in Weekly');break}
  case'collapse':{const id=el.closest('[data-sec]').dataset.sec;collapsed[id]=!collapsed[id];renderDaily();break}
  case'add-section':{const n=prompt('Section name?');if(n&&n.trim()){settings.sections.push({id:'s'+uid(),label:n.trim(),custom:true});saveSettings();renderDaily()}break}
  case'del-section':{const id=el.closest('[data-sec]').dataset.sec;if(confirm('Remove this section? Its tasks move to Personal Tasks.')){day.tasks.forEach(t=>{if(t.group===id)t.group='personal'});settings.sections=settings.sections.filter(s=>s.id!==id);saveSettings();saveDay();renderDaily()}break}
  case'add-block':{const n=prompt('Block label (e.g. 6a–9a)?');if(n&&n.trim()){settings.blocks.push({id:'b'+uid(),label:n.trim(),note:'',custom:true});saveSettings();renderDaily()}break}
  case'del-block':{const id=el.closest('[data-bk]').dataset.bk;day.tasks.forEach(t=>{if(t.slot===id)t.slot='sec'});settings.blocks=settings.blocks.filter(b=>b.id!==id);saveSettings();saveDay();renderDaily();break}
  case'drop':{const i=+el.dataset.i;day.water=day.water===i?i-1:i;saveDay();renderDaily();break}
  case'evdone':{const ev=cal.events.find(x=>x.id===el.dataset.id);if(ev){const s=new Set(ev.doneDates);s.has(curDate)?s.delete(curDate):s.add(curDate);ev.doneDates=[...s];saveCal();renderDaily()}break}
  case'sug-add':{const r=rec.list.find(x=>x.id===el.dataset.id);if(r){bookmarkRec(r);saveDay();renderDaily()}break}
  case'sug-skip':{day.dismissed.push(el.dataset.id);saveDay();renderDaily();break}
  case'sug-all':{suggested().forEach(bookmarkRec);saveDay();renderDaily();break}
  case'carry-add':{const c=carryItems()[+el.dataset.i];if(c){day.tasks.push(mk({t:c.t,group:c.group}));saveDay();renderDaily()}break}
  case'carry-hide':{const c=carryItems()[+el.dataset.i];if(c){day.hiddenCarry.push(c.t.toLowerCase());saveDay();renderDaily()}break}
  case'carry-all':{carryItems().forEach(c=>day.tasks.push(mk({t:c.t,group:c.group})));saveDay();renderDaily();break}
  case'goal-day':{const g=well.goals.find(x=>x.id===$('#goal-pick').value);if(g){day.tasks.push(mk({t:g.name,group:'well'}));saveDay();renderDaily()}break}
  /* weekly */
  case'chip':{const d=+el.dataset.d;recForm.days=recForm.days.includes(d)?recForm.days.filter(x=>x!==d):[...recForm.days,d];el.classList.toggle('on');break}
  case'rec-add':{const n=$('#rc-name').value.trim();if(!n||!recForm.days.length){toast('Add a name and pick at least one day');break}
    rec.list.push({id:uid(),name:n,time:$('#rc-time').value,group:$('#rc-group').value,days:recForm.days.slice(),until:$('#rc-until').value,start:TODAY});recForm={days:[]};saveRec();renderWeekly();break}
  case'rec-day':{const r=rec.list.find(x=>x.id===row.dataset.id),d=+el.dataset.d,ds=arr(r.days).map(Number);r.days=ds.includes(d)?ds.filter(x=>x!==d):[...ds,d];saveRec();renderWeekly();break}
  case'rec-del':{rec.list=rec.list.filter(x=>x.id!==row.dataset.id);saveRec();renderWeekly();break}
  case'wk-prev':weekStart=addDays(weekStart,-7);renderWeekly();break;
  case'wk-next':weekStart=addDays(weekStart,7);renderWeekly();break;
  case'wk-today':weekStart=addDays(TODAY,-parse(TODAY).getDay());renderWeekly();break;
  case'goto':loadDay(el.dataset.d).then(()=>showTab('daily'));break;
  /* monthly */
  case'mo-prev':mon.m--;if(mon.m<0){mon.m=11;mon.y--}renderMonthly();break;
  case'mo-next':mon.m++;if(mon.m>11){mon.m=0;mon.y++}renderMonthly();break;
  case'mo-today':mon={y:parse(TODAY).getFullYear(),m:parse(TODAY).getMonth()};selDate=TODAY;renderMonthly();break;
  case'mo-sel':selDate=el.dataset.d;renderMonthly();break;
  case'ev-add':{const t=$('#ev-title').value.trim();if(!t)break;
    cal.events.push({id:uid(),title:t,time:$('#ev-time').value,cat:$('#ev-cat').value,notes:$('#ev-notes').value,date:selDate,repeat:$('#ev-rep').value,doneDates:[]});saveCal();renderMonthly();break}
  case'ev-del':{cal.events=cal.events.filter(x=>x.id!==row.dataset.id);saveCal();renderMonthly();break}
  case'cat-add':{const n=$('#cat-new').value.trim();if(n&&!cal.cats.includes(n)){cal.cats.push(n);saveCal();renderMonthly()}break}
  /* wellness */
  case'symp':{const s=el.dataset.s,l=day.well.symptoms;day.well.symptoms=l.includes(s)?l.filter(x=>x!==s):[...l,s];saveDay();renderWellness();break}
  case'wadd':{const ar=el.closest('.addrow'),v=ar.querySelector('input').value.trim(),L=ar.dataset.list;if(!v)break;
    if(L==='goal')well.goals.push({id:uid(),name:v});
    else if(L==='workout')well.workouts.push({id:uid(),date:curDate,type:v,mins:''});
    else if(L==='book')well.books.push({id:uid(),title:v,status:'To read',format:'Paperback'});
    else if(L==='bucket')well.bucket.push({id:uid(),title:v,done:false,subs:[]});
    else if(L==='place')well.places.push({id:uid(),name:v,type:$('#place-type').value,visited:false,notes:''});
    else if(L.startsWith('sub:')){const b=well.bucket.find(x=>x.id===L.slice(4));b.subs.push({id:uid(),t:v,count:0})}
    saveWell();renderWellness();break}
  case'wdel':{const x=rowIdx();if(x){x.r.list.splice(x.i,1);x.r.save();renderWellness()}break}
  case'goal-day2':{const g=well.goals.find(x=>x.id===row.dataset.id);if(g){day.tasks.push(mk({t:g.name,group:'well'}));saveDay();toast('Added to today')}break}
  case'bucket-day':{const b=well.bucket.find(x=>x.id===row.dataset.id);if(b){day.tasks.push(mk({t:b.title,group:'personal'}));saveDay();toast('Added to today')}break}
  case'sub-inc':{const r=rowItem(row);r.it.count=(r.it.count||0)+1;r.save();renderWellness();break}
  case'sub-del':{const r=rowItem(row);r.list.splice(r.list.indexOf(r.it),1);r.save();renderWellness();break}
  case'type-add':{const n=$('#type-new').value.trim();if(n&&!well.placeTypes.includes(n)){well.placeTypes.push(n);saveWell();renderWellness()}break}
  }
});
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)showTab(b.dataset.tab)});

/* ---------- boot ---------- */
async function boot(){
  if(!(window._fb&&window._fb.ready)){await new Promise(r=>{const t=setTimeout(r,4500);window.addEventListener('fb-ready',()=>{clearTimeout(t);r()},{once:true})})}
  settings=normSettings(await store.load(K.settings));
  if(!(store.get(K.settings)&&store.get(K.settings).v>=2))saveSettings();
  well=normWell(await store.load(K.well));
  cal=normCal(await store.load(K.cal));
  const r=await store.load(K.rec);rec={list:arr(r&&r.list)};rec.list.forEach(x=>x.days=arr(x.days));
  setSync(window._fb&&window._fb.ready?'ok':'local');
  await loadDay(TODAY)}
boot();
</script>
</body>
</html>
