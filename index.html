.insight-good{background:#e8f0e0;}.insight-good h5{color:var(--green);}
.insight-focus{background:var(--parch);}.insight-focus h5{color:var(--terra);}
.eco-item{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:9px;border-bottom:.5px solid var(--border);font-size:13px;font-family:var(--body);flex-wrap:wrap;}
.eco-item:last-of-type{border-bottom:none;}
.eco-item input[type=text],.eco-item input:not([type]),.eco-item input[type=date]{border:none;border-bottom:1px solid transparent;background:transparent;font-size:13px;font-family:var(--body);outline:none;color:var(--text);}
.eco-item input:focus{border-bottom-color:var(--terra);}
.eco-item .grow{flex:1;min-width:130px;}
.eco-item select{font-size:11px;border:.5px solid var(--border);border-radius:6px;padding:2px 6px;background:var(--card);font-family:var(--sans);}
.eco-item.sub{margin-left:26px;}
.eco-chk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-size:9px;color:#fff;}
.eco-chk.done{background:var(--terra);border-color:var(--terra);}
.add-to-day-btn{font-size:10px;padding:2px 8px;border-radius:10px;border:.5px solid var(--terra);color:var(--terra);background:transparent;cursor:pointer;font-family:var(--sans);}
.add-to-day-btn:hover{background:var(--terra);color:#fff;}
.health-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.health-cell{background:var(--bg2);border-radius:10px;padding:10px 12px;text-align:center;}
.health-lbl{font-family:var(--head);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.health-cell input{width:100%;border:none;background:transparent;font-size:18px;font-weight:600;color:var(--terra);outline:none;text-align:center;font-family:var(--head);}
.symptom-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.goal-progress{display:flex;align-items:center;gap:10px;margin-top:8px;}
.goal-bar-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.goal-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--terra),var(--yellow));transition:width .4s;}
.goal-pct{font-size:11px;color:var(--muted);min-width:110px;text-align:right;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.target-in{width:46px;border:none;border-bottom:.5px solid var(--border);background:transparent;font-size:11px;color:var(--terra);outline:none;text-align:center;}
/* monthly */
.mo-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:1rem;flex-wrap:wrap;}
.mo-title{font-family:var(--head);font-size:18px;color:var(--darkred);letter-spacing:.08em;min-width:200px;text-align:center;}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:1.25rem;}
.mhead{text-align:center;font-family:var(--head);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px;}
.mcell{min-height:96px;background:var(--card);border:.5px solid var(--border);border-radius:10px;padding:6px;cursor:pointer;overflow:hidden;min-width:0;}
.mcell:hover{border-color:var(--border2);}
.mcell.blank{background:transparent;border:none;cursor:default;}
.mcell.today{background:var(--parch);border-color:var(--terra);}
.mcell.sel{border:1.5px solid var(--darkred);}
.mcell .n{font-family:var(--head);font-size:13px;color:var(--text);}
.mcell.today .n{color:var(--terra);}
.mcell .wk-pill{margin:2px 0;}
.more{font-size:10px;color:var(--terra);}
.toast button{margin-left:12px;background:#fff;color:var(--green);border:none;border-radius:12px;padding:2px 12px;cursor:pointer;font-size:12px;}
.ia-btn.del{color:var(--red);font-size:13px;opacity:.75;}.ia-btn.del:hover{opacity:1;background:#f5e8ea;}
.del-btn{font-size:11px;padding:3px 12px;border-radius:20px;border:.5px solid var(--red);background:transparent;color:var(--red);cursor:pointer;font-family:var(--sans);}.del-btn:hover{background:var(--red);color:#fff;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:9px 18px;border-radius:20px;display:none;z-index:300;font-size:13px;}
@media(min-width:900px){.view{padding:1.75rem 2rem 5rem;}}
@media(max-width:700px){.meal-grid{grid-template-columns:1fr!important}.nav{padding:.75rem 1rem;flex-wrap:wrap;gap:8px;}.nav-tabs{order:3;width:100%;justify-content:center;}.msb-grid,.meal-grid,.health-grid,.two-col,.blocks-layout,.insights{grid-template-columns:1fr;}.week-grid{grid-template-columns:repeat(2,1fr);}.view{padding:1rem 1rem 5rem;}.mcell{min-height:62px;padding:3px;}.mcell .wk-pill{font-size:9px;padding:1px 3px;}.summary{flex-wrap:wrap;}}
@media print{.nav,.end-day-btn,.add-row,.ia-btn,.repeat-modal,.sum-btn{display:none!important;}body{background:#fff!important;}.view{display:none!important;}#view-daily{display:block!important;padding:0;}}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-brand"><img src="syd-logo.png" alt="SYD" onerror="this.onerror=null;this.src='syd-logo.PNG'"></div>
  <div class="nav-tabs">
    <button class="tab-btn active" data-tab="daily">Daily</button>
    <button class="tab-btn" data-tab="weekly">Weekly</button>
    <button class="tab-btn" data-tab="monthly">Monthly</button>
    <button class="tab-btn" data-tab="wellness">Wellness</button>
  </div>
  <div class="nav-right"><input type="date" id="syd-date"></div>
</nav>

<div class="repeat-modal" id="rep-modal"><div class="repeat-box">
  <h3>Repeat task</h3><div id="rep-name" style="font-size:13px;color:var(--text);"></div>
  <label>Repeat on</label>
  <div class="day-checks" id="rep-days"></div>
  <div class="day-checks" style="margin-top:10px">
    <span class="day-check" data-act="rep-preset" data-p="all">Every day</span>
    <span class="day-check" data-act="rep-preset" data-p="wk">Weekdays</span>
  </div>
  <div class="repeat-actions">
    <button class="btn-cancel" data-act="rep-stop" id="rep-stop" style="display:none">Stop repeating</button>
    <button class="btn-cancel" data-act="rep-cancel">Cancel</button>
    <button class="btn-save" data-act="rep-save">Save</button>
  </div>
</div></div>

<div class="view active" id="view-daily"></div>
<div class="view" id="view-weekly"></div>
<div class="view" id="view-monthly"></div>
<div class="view" id="view-wellness"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const arr=x=>Array.isArray(x)?x:(x&&typeof x==='object'?Object.values(x):[]);
const TODAY=fmt(new Date());
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pretty=(s,o)=>parse(s).toLocaleDateString('en-US',o||{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const cap=s=>s?s[0].toUpperCase()+s.slice(1):'';
const toast=(m,undo)=>{const t=$('#toast');t.textContent=m;if(undo){const b=document.createElement('button');b.textContent='Undo';b.dataset.act='undo-del';t.appendChild(b)}t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',undo?7000:2400)};
let lastDel=null;
function tmin(s){s=(s||'').trim().toLowerCase();const m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*([ap])?m?$/);if(!m)return 9999;let h=+m[1];const mi=+(m[2]||0);if(m[3]==='p'&&h<12)h+=12;if(m[3]==='a'&&h===12)h=0;return h*60+mi}
const K={day:'syd3_day_',settings:'syd3_settings',well:'syd3_well',cal:'syd3_cal',rec:'syd3_rec'};
const dot=c=>`<div class="dot" style="background:${c}"></div>`;
const ctitle=(c,t,extra)=>`<div class="card-title">${dot(c)}${t}${extra||''}</div>`;

/* ---------- storage (local first, Firebase sync, newest wins) ---------- */
function setSync(s){const e=$('#sync-status');if(!e)return;e.style.color=s==='ok'?'var(--green)':'var(--terra)';e.textContent=s==='ok'?'Saved ✓ (cloud)':s==='saving'?'Saving…':'Not syncing ⚠';e.title=s==='local'?(store.err||'Cloud unavailable'):''}
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  loc(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  async put(k,v){v._ts=Date.now();this.loc(k,v);setSync('saving');
    if(window._fb&&window._fb.ready){try{await window._fb.set('syd/'+k,v);this.err='';setSync('ok')}catch(e){this.err=(e&&(e.code||e.message))||'write failed';setSync('local')}}else{this.err=window._fbErr||'Firebase did not load';setSync('local')}},
  async load(k){const l=this.get(k);let r=null;
    if(window._fb&&window._fb.ready){try{r=await window._fb.get('syd/'+k)}catch(e){this.err=(e&&(e.code||e.message))||'read failed';setSync('local')}}
    if(r&&(!l||(r._ts||0)>(l._ts||0))){this.loc(k,r);return r}return l}
};

/* ---------- state ---------- */
const DEF_SECTIONS=[{id:'work',label:'Work Tasks'},{id:'home',label:'Home Tasks'},{id:'client',label:'Client Tasks'},{id:'personal',label:'Personal Tasks'}];
const DEF_BLOCKS=[{id:'w1',label:'9a–12p',note:''},{id:'w2',label:'12p–3p',note:'~2:00p Lunch'},{id:'w3',label:'3p–6p',note:''},{id:'w4',label:'6p–9p',note:'~8:00p Dinner'}];
let settings={cycleStart:'2026-11-01',cycleLen:28,periodLen:7,waterGoal:8,sections:DEF_SECTIONS,blocks:DEF_BLOCKS,mealTimes:{breakfast:'~7:30a',lunch:'~2:00p',dinner:'~8:00p'},v:2};
let well={goals:[],workouts:[],workoutTarget:4,books:[],bookTarget:12,bucket:[],bucketTarget:10,places:[],placeTypes:['Restaurant','Travel','Retreat','Other']};
let cal={events:[],cats:['Personal','Work','Home','Client']};
let rec={list:[]};
let day=newDay(),curDate=TODAY,tab='daily';
let weekStart=addDays(TODAY,-parse(TODAY).getDay());
let mon={y:parse(TODAY).getFullYear(),m:parse(TODAY).getMonth()},selDate=TODAY;
const collapsed={};
const uiGet=(k,d)=>{try{const v=localStorage.getItem('syd3_ui_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const uiSet=(k,v)=>{try{localStorage.setItem('syd3_ui_'+k,JSON.stringify(v))}catch(e){}};
let recOpen=uiGet('recOpen',true);
let recForm={days:[]},rep=null;

function pad3(a){a=arr(a).slice(0,3);while(a.length<3)a.push('');return a}
function newDay(){return{intention:'',mood:'',verse:'',carry:'',grat:['','',''],wins:['','',''],water:0,meals:{breakfast:'',lunch:'',dinner:''},tasks:[],dismissed:[],hiddenCarry:[],well:{sleep:'',energy:'',weight:'',mood:'',notes:'',symptoms:[]}}}
function normDay(d){const n=Object.assign(newDay(),d||{});n.tasks=arr(n.tasks);n.dismissed=arr(n.dismissed);n.hiddenCarry=arr(n.hiddenCarry);n.grat=pad3(n.grat);n.wins=pad3(n.wins);
  n.meals=Object.assign({breakfast:'',lunch:'',dinner:''},n.meals||{});n.well=Object.assign(newDay().well,n.well||{});n.well.symptoms=arr(n.well.symptoms);return n}
function normSettings(s){const n=Object.assign({},settings,s||{});n.sections=arr(n.sections).length?arr(n.sections):DEF_SECTIONS;n.blocks=arr(n.blocks).length?arr(n.blocks):DEF_BLOCKS;
  n.mealTimes=Object.assign({breakfast:'~7:30a',lunch:'~2:00p',dinner:'~8:00p'},n.mealTimes||{});
  if(!(s&&s.v>=2)){n.cycleStart='2026-11-01';n.v=2}
  if(!n.sections.some(x=>x.id==='personal'))n.sections.push({id:'personal',label:'Personal Tasks'});return n}
function normWell(w){const n=Object.assign({},well,w||{});['goals','workouts','books','bucket','places','placeTypes'].forEach(k=>n[k]=arr(n[k]));n.bucket.forEach(b=>b.subs=arr(b.subs));return n}
function normCal(c){const n=Object.assign({},cal,c||{});n.events=arr(n.events);n.events.forEach(e=>e.doneDates=arr(e.doneDates));n.cats=arr(n.cats).length?arr(n.cats):cal.cats;return n}

/* ---------- saving ---------- */
let saveT=null,dirty=false;
function saveDay(){dirty=true;store.loc(K.day+curDate,Object.assign({},day,{_ts:Date.now()}));setSync('saving');clearTimeout(saveT);saveT=setTimeout(flush,700)}
function flush(){if(!dirty)return;dirty=false;clearTimeout(saveT);store.put(K.day+curDate,day)}
const saveSettings=()=>store.put(K.settings,settings);
const saveWell=()=>store.put(K.well,well);
const saveCal=()=>store.put(K.cal,cal);
const saveRec=()=>store.put(K.rec,rec);
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

/* ---------- cycle ---------- */
const PHASE_DATA={
  menstrual:{label:'Menstrual',cls:'phase-menstrual',title:'Rest and reflect — slow down, listen.',work:'Insight week. Reflect, review, plan.',meal:'Iron-rich foods, warming soups, ginger tea, omega-3s.',routine:'Rest is productive. Gentle stretching, early bedtime.',workout:'Rest days, gentle yoga, short walks.'},
  follicular:{label:'Follicular',cls:'phase-follicular',title:'Fresh energy — begin and build.',work:'Brainstorm, plan, start new projects.',meal:'Fresh greens, fermented foods, lean protein, citrus.',routine:'Try something new. Social time and creative sessions.',workout:'Rising energy — cardio, dance, strength.'},
  ovulatory:{label:'Ovulatory',cls:'phase-ovulatory',title:'Peak power — lead, connect, launch.',work:'Your most magnetic phase. Launches, speaking, negotiations.',meal:'Raw veggies, anti-inflammatory foods, light proteins, berries.',routine:'Intense workouts, networking events, being visible.',workout:'Peak performance — push intensity, try new challenges.'},
  luteal:{label:'Luteal',cls:'phase-luteal',title:'Completion mode — finish, refine, admin.',work:'Wrap up projects, edit, organize, handle backend work.',meal:'Complex carbs, magnesium-rich foods, warming meals.',routine:'Gentler movement — walks, yoga, pilates.',workout:'Moderate intensity — pilates, yoga, steady strength.'}
};
function cycleDay(ds){const diff=Math.round((parse(ds)-parse(settings.cycleStart))/864e5);const L=settings.cycleLen||28;return((diff%L)+L)%L+1}
function phaseKey(ds){const d=cycleDay(ds),P=settings.periodLen||7;if(d<=P)return'menstrual';if(d<=13)return'follicular';if(d<=16)return'ovulatory';return'luteal'}
const phaseOf=ds=>PHASE_DATA[phaseKey(ds)].label;

/* ---------- recurring + calendar ---------- */
const isRoutine=g=>g==='morn'||g==='eve';
function recMatches(r,ds){const d=parse(ds);if(r.start&&ds<r.start)return false;if(r.until&&ds>r.until)return false;return arr(r.days).map(Number).includes(d.getDay())}
function entriesFor(ds){const d=parse(ds);return cal.events.filter(e=>{if(!e.date)return false;
  if(e.repeat==='weekly')return ds>=e.date&&parse(e.date).getDay()===d.getDay();
  if(e.repeat==='monthly')return ds>=e.date&&parse(e.date).getDate()===d.getDate();
  return e.date===ds}).sort((a,b)=>tmin(a.time)-tmin(b.time))}
const catColor=c=>['#2B458C','#284E04','#CF592B','#7A1A20','#F99C17','#5b3a7a','#2d7a7a'][Math.max(0,cal.cats.indexOf(c))%7];
function dayData(ds){return ds===curDate?day:normDay(store.get(K.day+ds))}
function groupLabel(g){const s=settings.sections.find(x=>x.id===g);if(s)return s.label;return{morn:'Morning Routine',eve:'Evening Routine',block:'Time Blocks',well:'Wellness',other:'Other'}[g]||g}
const SEC_COLORS=['var(--red)','var(--green)','#854F0B','var(--blue)','var(--terra)','var(--yellow)'];
const BLOCK_BG=['#fdf3e3','#e8f0e0','#f5e8ea','#e8edf8'];

/* ---------- task rendering ---------- */
const mk=o=>Object.assign({id:uid(),t:'',done:false,slot:'sec',group:'other',msb:'',start:'',end:'',astart:'',aend:'',block:'',note:''},o);
const fmtMin=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return (h%12===0?12:h%12)+':'+pad(mm)+(h<12?'a':'p')};
const timeCache={};
function timeList(step){if(timeCache[step])return timeCache[step];const a=[];for(let i=0;i<1440/step;i++)a.push(fmtMin(240+i*step));return timeCache[step]=a}
function timeSel(o){const l=timeList(o.step||15),val=o.val||'';
  let h=`<select class="${o.plain?'':'tsel '}${o.cls||''}"${o.f?` data-f="${o.f}"`:''}${o.id?` id="${o.id}"`:''}><option value="">${o.label}</option>`+l.map(x=>`<option${x===val?' selected':''}>${x}</option>`).join('');
  if(val&&!l.includes(val))h+=`<option selected>${esc(val)}</option>`;return h+'</select>'}
const nowStr=()=>{const d=new Date();return fmtMin(Math.round((d.getHours()*60+d.getMinutes())/5)*5)};
const ON_TIME=15;
function lateMin(t){if(!t.start||!t.astart)return null;const a=tmin(t.start),b=tmin(t.astart);if(a>=9999||b>=9999)return null;return b-a}
function lateBadge(t){const d=lateMin(t);if(d===null)return '';const ok=Math.abs(d)<=ON_TIME;return `<span class="late-badge ${ok?'ok':d>0?'late':'early'}">${d===0?'on time':d>0?d+'m late':(-d)+'m early'}</span>`}
function timeSummary(t,open){const p=[];if(t.start||t.end)p.push((t.start||'')+(t.end?' – '+t.end:''));if(t.astart||t.aend)p.push('actual '+(t.astart||'')+(t.aend?' – '+t.aend:''));if(!open&&t.note)p.push(t.note);return p.join(' · ')}
const rowOpen={};
const isOpen=t=>rowOpen[t.id]!==undefined?rowOpen[t.id]:!isRoutine(t.slot);
const isBlockSlot=sl=>settings.blocks.some(b=>b.id===sl);
function moveSelect(t){
  let o='<option value="">Move / assign…</option>';
  if(t.slot!=='morn')o+='<option value="m:morn">Move to Morning Routine</option>';
  if(t.slot!=='eve')o+='<option value="m:eve">Move to Evening Routine</option>';
  settings.blocks.forEach(b=>{if(t.block!==b.id&&t.slot!==b.id)o+=`<option value="b:${b.id}">Time block ${esc(b.label)}</option>`});
  if(t.block)o+='<option value="b:">Remove from time block</option>';
  if(t.slot!=='sec')o+='<option value="sec">Back to my task list</option>';
  return `<select data-act="assign">${o}</select>`}
function taskRow(t,where){
  const routine=isRoutine(t.slot),open=isOpen(t);
  const msb=routine?`<select data-f="msb" title="Mind / Spirit / Body">${['mind','spirit','body'].map(o=>`<option value="${o}"${(t.msb||'mind')===o?' selected':''}>${cap(o)}</option>`).join('')}</select>`:'';
  const cat=(where&&t.slot==='sec')?`<span class="repeat-badge" style="background:var(--bg2);color:var(--muted)">${esc(groupLabel(t.group))}</span>`:'';
  const blk=(!where&&t.block)?`<span class="repeat-badge" style="background:#fdf3e3;color:#7a4d00">⏱ ${esc((settings.blocks.find(b=>b.id===t.block)||{}).label||'block')}</span>`:'';
  const sum=timeSummary(t,open);
  const del=(where&&t.slot==='sec')?'<button class="ia-btn" data-act="unblock" title="Remove from this time block (stays in your list)">⊖</button>':'<button class="ia-btn del" data-act="del" title="Delete task">🗑</button>';
  return `<div class="item${t.done?' done':''}${t.recId?' repeating':''}" data-k="task" data-id="${t.id}">
  <div class="chk-wrap" data-act="toggle"><div class="checkbox"><span class="checkmark">✓</span></div></div>
  <div class="item-content"><input class="item-label" data-f="t" value="${esc(t.t)}" placeholder="Task">
   <div class="tsum">${sum?`<span>${esc(sum)}</span>`:''}${lateBadge(t)}${blk}${cat}${t.recId?'<span class="repeat-badge">repeats</span>':''}</div>
   ${open?`<input class="item-note" data-f="note" value="${esc(t.note)}" placeholder="add a note">
   <div class="item-meta"><span class="tgrp">Planned ${timeSel({f:'start',val:t.start,label:'Start'})}${timeSel({f:'end',val:t.end,label:'End'})}</span><span class="tgrp">Actual ${timeSel({f:'astart',val:t.astart,label:'Start',step:5,cls:'act'})}${timeSel({f:'aend',val:t.aend,label:'End',step:5,cls:'act'})}</span>${msb}${moveSelect(t)}${where?'':'<button class="del-btn" data-act="del">Delete task</button>'}</div>`:''}</div>
  <div class="item-actions"><button class="ia-btn" data-act="det" title="Show / hide details">${open?'▾':'▸'}</button><button class="ia-btn" data-act="repeat" title="Repeat">↺</button>${where?'':'<button class="ia-btn" data-act="up">▲</button><button class="ia-btn" data-act="down">▼</button>'}${del}</div></div>`}
function blockList(b){const l=day.tasks.filter(t=>t.slot===b.id||t.block===b.id).sort((x,y)=>tmin(x.start)-tmin(y.start));return l.length?l.map(t=>taskRow(t,b.id)).join(''):'<div class="empty-drop">Nothing here yet.</div>'}
const listHTML=(f,empty)=>{const l=day.tasks.filter(f);return l.length?l.map(t=>taskRow(t)).join(''):(empty===false?'':'<div class="empty-drop">Nothing here yet.</div>')};
const addRow=(list,ph,routine)=>`<div class="add-row" data-list="${list}">${timeSel({label:'Time',cls:'a-time',plain:true})}<input class="a-lbl" placeholder="${ph}">${routine?`<select class="a-msb"><option value="mind">Mind</option><option value="spirit">Spirit</option><option value="body">Body</option></select><select class="a-rep"><option value="">Just today</option><option value="all">Repeat every day</option><option value="wk">Repeat weekdays</option></select>`:''}<button data-act="add">+ Add</button></div>`;

function routineCard(slot,title,color){
  const cols=[['mind','var(--blue)'],['spirit','var(--terra)'],['body','var(--green)']];
  return `<div class="card">${ctitle(color,title,'<button class="sum-btn" style="margin-left:auto" data-act="routine-toggle" data-slot="'+slot+'">Collapse / expand details</button>')}<div class="msb-grid">${cols.map(([k,c])=>`<div class="msb-cell"><div class="msb-lbl" style="color:${c}">${cap(k)}</div><div class="msb-drop">${listHTML(t=>t.slot===slot&&(t.msb||'mind')===k,false)}</div></div>`).join('')}</div>${addRow(slot,'Add a '+(slot==='morn'?'morning':'evening')+' routine task…',true)}</div>`}

function carryItems(){const out=[],seen=new Set(day.tasks.map(t=>(t.t||'').trim().toLowerCase())),ids=settings.sections.map(x=>x.id);
  for(let i=1;i<=14;i++){const ds=addDays(curDate,-i),d=store.get(K.day+ds);if(!d)continue;
    arr(d.tasks).forEach(t=>{const key=(t.t||'').trim().toLowerCase();
      if(!key||!ids.includes(t.group)||t.recId||seen.has(key))return;
      seen.add(key);                                  /* the most recent occurrence decides */
      if(t.done||t.carryDeleted||day.hiddenCarry.includes(key))return;
      out.push({t:t.t,group:t.group,from:ds})})}
  return out}
function delCarry(list){list.forEach(c=>{const key=c.t.trim().toLowerCase(),d=store.get(K.day+c.from);if(!d)return;
    d.tasks=arr(d.tasks);d.tasks.forEach(t=>{if((t.t||'').trim().toLowerCase()===key&&!t.done)t.carryDeleted=true});store.put(K.day+c.from,d)})}
function prefetchCarry(ds){const before=JSON.stringify(carryItems());
  Promise.all(Array.from({length:14},(_,i)=>store.load(K.day+addDays(ds,-i-1)))).then(()=>{
    if(curDate!==ds||tab!=='daily'||JSON.stringify(carryItems())===before)return;
    const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
    const y=window.scrollY;renderDaily();window.scrollTo(0,y)}).catch(()=>{})}
function suggested(){return rec.list.filter(r=>!isRoutine(r.group)&&recMatches(r,curDate)&&!day.tasks.some(t=>t.recId===r.id)&&!day.dismissed.includes(r.id))}
function applyRoutineRec(){let ch=false;
  rec.list.forEach(r=>{if(!isRoutine(r.group)||!recMatches(r,curDate))return;
    if(day.tasks.some(t=>t.recId===r.id)||day.dismissed.includes(r.id))return;
    day.tasks.push(mk({t:r.name,slot:r.group,group:r.group,msb:r.msb||'mind',start:r.time||'',recId:r.id}));ch=true});
  if(ch)saveDay()}

function stats(){const T=day.tasks.length,D=day.tasks.filter(t=>t.done).length,p=T?Math.round(D/T*100):0;
  const a=$('#done-count');if(!a)return;a.textContent=D;$('#total-count').textContent=T;$('#main-bar').style.width=p+'%';$('#pct-lbl').textContent=p+'% complete'}

function wellItems(cat){
  if(cat==='reading')return well.books.filter(b=>b.status!=='Finished').map(b=>b.title);
  if(cat==='places')return well.places.filter(p=>!p.visited).map(p=>p.name);
  if(cat==='bucket')return well.bucket.filter(b=>!b.done).map(b=>b.title);
  if(cat==='workout')return[...new Set(['Pilates','Walk','Strength','Yoga','Run',...well.workouts.map(w=>w.type)])].filter(Boolean);
  if(cat==='goal')return well.goals.map(g=>g.name);return[]}

   <div class="phase-tips"><strong>Work focus:</strong> ${P.work}</div><div class="phase-tips" style="margin-top:4px;"><strong>Workout suggestion:</strong> ${P.workout}</div><div class="phase-tips" style="margin-top:4px;"><strong>Routine tip:</strong> ${P.routine}</div>

  el.innerHTML=h;stats();setSync(dirty?'saving':(window._fb&&window._fb.ready?'ok':'local'))}

/* ---------- check-in insights ---------- */
function checkIns(dates){return dates.map(ds=>({ds,w:dayData(ds).well})).filter(x=>x.w.sleep||x.w.energy||x.w.weight||x.w.mood||x.w.notes||x.w.symptoms.length)}
const lastDays=(n,end)=>Array.from({length:n},(_,i)=>addDays(end,-i));
const avgOf=(l,k)=>{const v=l.map(x=>parseFloat(x.w[k])).filter(x=>!isNaN(x));return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'—'};
function symCounts(l){const c={};l.forEach(x=>x.w.symptoms.forEach(sy=>c[sy]=(c[sy]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1])}
function timelinessCard(days){const rows=[];days.forEach(ds=>dayData(ds).tasks.forEach(t=>{const d=lateMin(t);if(d!==null)rows.push({g:t.group,d})}));
  const head=ctitle('var(--blue)','Timeliness','<span style="margin-left:auto;font-size:11px;color:var(--muted)">Planned vs actual start</span>');
  if(!rows.length)return `<div class="card" style="margin-top:1rem">${head}<div class="empty-drop">Set a planned time and an actual time on your tasks and your timeliness will show here.</div></div>`;
  const ok=rows.filter(r=>Math.abs(r.d)<=ON_TIME).length,avg=rows.reduce((a,r)=>a+r.d,0)/rows.length,ab=rows.reduce((a,r)=>a+Math.abs(r.d),0)/rows.length;
  const fm=m=>{m=Math.round(m);return m===0?'on time':m>0?m+' min late':(-m)+' min early'};
  const by={};rows.forEach(r=>{(by[r.g]=by[r.g]||[]).push(r.d)});
  return `<div class="card" style="margin-top:1rem">${head}<div class="health-grid">${[['Tasks measured',rows.length],['On time (±'+ON_TIME+' min)',Math.round(ok/rows.length*100)+'%'],['Average',fm(avg)],['Avg drift',Math.round(ab)+' min']].map(([l,v])=>`<div class="health-cell"><div class="health-lbl">${l}</div><div style="font-family:var(--head);font-size:16px;color:var(--terra)">${v}</div></div>`).join('')}</div>
  <div class="sub-lbl">By category</div>${Object.entries(by).map(([g,l])=>`<div style="font-size:12px;padding:3px 0"><b>${esc(groupLabel(g))}</b> — ${fm(l.reduce((a,b)=>a+b,0)/l.length)} <span style="color:var(--muted)">(${l.length} task${l.length>1?'s':''})</span></div>`).join('')}</div>`}
function weekCheckCard(days){const l=checkIns(days),sc=symCounts(l);
  return `<div class="card" style="margin-top:1rem">${ctitle('var(--red)','Wellness check-ins this week')}${l.length?`<div class="health-grid">${[['sleep','Avg sleep'],['energy','Avg energy'],['weight','Avg weight'],['mood','Avg mood']].map(([k,t])=>`<div class="health-cell"><div class="health-lbl">${t}</div><div style="font-family:var(--head);font-size:18px;color:var(--terra)">${avgOf(l,k)}</div></div>`).join('')}</div><div style="font-size:12px;color:var(--muted);margin-top:10px">${l.length} check-in${l.length>1?'s':''} · ${sc.length?'Most common: '+sc.slice(0,5).map(([n,c])=>`${esc(n)} (${c})`).join(', '):'no symptoms logged'}</div>`:'<div class="empty-drop">No check-ins this week yet. Log one in the Wellness tab.</div>'}</div>`}
function checkInHistory(){const l=checkIns(lastDays(60,TODAY));
  return `<div class="card">${ctitle('var(--red)','Check-in history','<span style="margin-left:auto;font-size:11px;color:var(--muted)">Last 60 days</span>')}${l.length?l.map(x=>`<div class="eco-item"><div style="min-width:110px"><b style="cursor:pointer;color:var(--terra)" data-act="goto" data-d="${x.ds}">${esc(pretty(x.ds,{month:'short',day:'numeric',weekday:'short'}))}</b><div style="font-size:10px;color:var(--muted)">Day ${cycleDay(x.ds)} · ${phaseOf(x.ds)}</div></div><div class="grow" style="font-size:12px;color:var(--text)">${[['sleep','Sleep','h'],['energy','Energy','/10'],['weight','Weight',' lbs'],['mood','Mood','/10']].filter(([k])=>x.w[k]).map(([k,t,u])=>`${t} ${esc(x.w[k])}${u}`).join(' · ')||'<span style="color:var(--subtle)">No numbers</span>'}${x.w.symptoms.length?`<div style="margin-top:4px">${x.w.symptoms.map(sy=>`<span class="repeat-badge" style="background:#f5e8ea;color:var(--red)">${esc(sy)}</span>`).join(' ')}</div>`:''}${x.w.notes?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(x.w.notes)}</div>`:''}</div></div>`).join(''):'<div class="empty-drop">Your check-ins will show up here.</div>'}</div>`}
function symptomPatterns(){const l=checkIns(lastDays(90,TODAY)).filter(x=>x.w.symptoms.length);

  <div class="sub-lbl">By cycle day</div>${Object.entries(byDay).sort((a,b)=>Object.values(b[1]).reduce((x,y)=>x+y,0)-Object.values(a[1]).reduce((x,y)=>x+y,0)).map(([n,d])=>`<div style="font-size:12px;padding:3px 0"><b>${esc(n)}</b> — ${Object.entries(d).sort((a,b)=>a[0]-b[0]).map(([k,c])=>`day ${k}${c>1?' ×'+c:''}`).join(', ')}</div>`).join('')}</div>`}

const msbOptions=sel=>['mind','spirit','body'].map(o=>`<option value="${o}"${(sel||'mind')===o?' selected':''}>${cap(o)}</option>`).join('');
function renderWeekly(){
  const el=$('#view-weekly'),days=Array.from({length:7},(_,i)=>addDays(weekStart,i));
  let h=`<div class="page-hdr"><img src="syd-logo.png" alt="SYD" onerror="this.onerror=null;this.src='syd-logo.PNG'"><h1>WEEKLY VIEW</h1><p>Your rhythm at a glance.</p></div>
  <div class="card"><div class="card-title" style="cursor:pointer;margin-bottom:${recOpen?12:0}px" data-act="rec-toggle">${dot('var(--blue)')}Recurring tasks (${rec.list.length})<span style="margin-left:auto;color:var(--subtle)">${recOpen?'▾ hide':'▸ show'}</span></div><div style="display:${recOpen?'block':'none'}"><div style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6">Tasks for your sections show up as <b>suggestions</b> on the matching days in Daily. Morning and evening routine tasks are <b>added automatically</b> so you can just check them off.</div>

/* ---------- day loading ---------- */
async function loadDay(ds){flush();curDate=ds;$('#syd-date').value=ds;
  let d=await store.load(K.day+ds);
  if(!d&&ds==='2026-04-06'){d={tasks:[
    {id:uid(),t:'Morning prayer & journaling',slot:'morn',group:'morn',msb:'spirit',done:false},
    {id:uid(),t:'Review client deliverables',slot:'sec',group:'client',done:false},
    {id:uid(),t:'Plan the week ahead',slot:'sec',group:'work',done:false},
    {id:uid(),t:'Tidy the kitchen',slot:'sec',group:'home',done:false},
    {id:uid(),t:'Evening wind-down',slot:'eve',group:'eve',msb:'body',done:false}]}}
  day=normDay(d);applyRoutineRec();render();prefetchCarry(ds)}

/* ---------- add / repeat helpers ---------- */
function newRec(o){const r=Object.assign({id:uid(),name:'',time:'',group:'personal',msb:'mind',days:[],until:'',start:curDate},o);rec.list.push(r);saveRec();return r}
function addTo(list,text,extra,repMode){text=(text||'').trim();if(!text)return;
  const o={t:text,start:(extra&&extra.start)||'',msb:(extra&&extra.msb)||''};
  if(list==='morn'||list==='eve'){o.slot=list;o.group=list;o.msb=o.msb||'mind'}
  else if(list.startsWith('blk:')){o.slot=list.slice(4);o.group='block'}
  else if(list.startsWith('sec:')){o.slot='sec';o.group=list.slice(4)}
  const t=mk(o);
  if(repMode&&isRoutine(list)){const r=newRec({name:text,time:o.start,group:list,msb:o.msb,days:repMode==='all'?[0,1,2,3,4,5,6]:[1,2,3,4,5]});t.recId=r.id}
  day.tasks.push(t);saveDay();renderDaily()}
function bookmarkRec(r){day.tasks.push(mk({t:r.name,start:r.time||'',group:r.group,recId:r.id}))}
function openRepeat(taskId){const t=day.tasks.find(x=>x.id===taskId);if(!t)return;
  const r=t.recId&&rec.list.find(x=>x.id===t.recId);
  rep={taskId,recId:r?r.id:null,days:r?arr(r.days).map(Number):[parse(curDate).getDay()]};
  $('#rep-name').textContent=t.t;$('#rep-stop').style.display=r?'inline-block':'none';drawRep();$('#rep-modal').classList.add('open')}
function drawRep(){$('#rep-days').innerHTML=DOW.map((d,i)=>`<span class="day-check${rep.days.includes(i)?' on':''}" data-act="rep-day" data-d="${i}">${d}</span>`).join('')}

/* ---------- registry for editable rows ---------- */
const REG={task:{l:()=>day.tasks,s:saveDay},rec:{l:()=>rec.list,s:saveRec},ev:{l:()=>cal.events,s:saveCal},
  goal:{l:()=>well.goals,s:saveWell},workout:{l:()=>well.workouts,s:saveWell},book:{l:()=>well.books,s:saveWell},
  bucket:{l:()=>well.bucket,s:saveWell},place:{l:()=>well.places,s:saveWell}};
function rowItem(row){
  if(row.dataset.k==='sub'){const b=well.bucket.find(x=>x.id===row.dataset.parent);return b&&{it:b.subs.find(x=>x.id===row.dataset.id),save:saveWell,list:b.subs}}
  const R=REG[row.dataset.k];if(!R)return null;return{it:R.l().find(x=>x.id===row.dataset.id),save:R.s,list:R.l()}}

/* ---------- events ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.day){day[t.dataset.day]=t.value;saveDay();return}
  if(t.dataset.meal){day.meals[t.dataset.meal]=t.value;saveDay();return}
  if(t.dataset.arr){day[t.dataset.arr][+t.dataset.i]=t.value;saveDay();return}
  if(t.dataset.wf){day.well[t.dataset.wf]=t.value;saveDay();return}
  if(t.dataset.bf){const b=settings.blocks.find(x=>x.id===t.closest('[data-bk]').dataset.bk);b[t.dataset.bf]=t.value;saveSettings();return}
  if(t.dataset.sf){const s=settings.sections.find(x=>x.id===t.closest('[data-sec]').dataset.sec);s.label=t.value;saveSettings();return}
  const row=t.closest('[data-k]');
  if(row&&t.dataset.f&&t.type!=='checkbox'&&t.tagName!=='SELECT'){const r=rowItem(row);if(r&&r.it){r.it[t.dataset.f]=t.value;r.save()}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='syd-date'){if(t.value)loadDay(t.value);return}
  if(t.id==='cycle-start'){if(t.value){settings.cycleStart=t.value;saveSettings();renderDaily()}return}
  if(t.id==='dw-category'){const items=wellItems(t.value);$('#dw-item').innerHTML='<option value="">Select item...</option>'+items.map(i=>`<option>${esc(i)}</option>`).join('');return}
  if(t.id==='wk-target'){well.workoutTarget=+t.value||1;saveWell();return}
  if(t.id==='book-target'){well.bookTarget=+t.value||1;saveWell();return}
  if(t.id==='bucket-target'){well.bucketTarget=+t.value||1;saveWell();return}
  const row=t.closest('[data-k]');
  if(t.dataset.act==='assign'&&row){const tk=day.tasks.find(x=>x.id===row.dataset.id),v=t.value;if(!tk||!v)return;
    if(v==='sec'){tk.slot='sec';tk.block='';if(!settings.sections.some(x=>x.id===tk.group)&&tk.group!=='well')tk.group='personal'}
    else if(v==='m:morn'||v==='m:eve'){tk.slot=v.slice(2);if(!tk.msb)tk.msb='mind'}
    else if(v==='b:'){tk.block=''}
    else if(v.startsWith('b:')){const id=v.slice(2);if(isBlockSlot(tk.slot))tk.slot=id;else tk.block=id}
    saveDay();renderDaily();return}
  if(row&&t.dataset.f&&(t.tagName==='SELECT'||t.type==='date')){
    const r=rowItem(row);if(!r||!r.it)return;r.it[t.dataset.f]=t.value;r.save();render();}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const ar=e.target.closest('.add-row');if(ar){e.preventDefault();const b=ar.querySelector('button[data-act]');b&&b.click()}}});
document.querySelector('.nav-tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)showTab(b.dataset.tab)});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;const a=el.dataset.act,row=el.closest('[data-k]');
  const rowIdx=()=>{const r=rowItem(row);return r&&{r,i:r.list.indexOf(r.it)}};
  switch(a){
  case'add':{const ar=el.closest('.add-row'),q=s=>ar.querySelector(s);
    addTo(ar.dataset.list,q('.a-lbl').value,{start:q('.a-time')?q('.a-time').value.trim():'',msb:q('.a-msb')?q('.a-msb').value:''},q('.a-rep')?q('.a-rep').value:'');break}
  case'toggle':{const t=day.tasks.find(x=>x.id===row.dataset.id);if(!t)break;t.done=!t.done;
    if(t.done&&curDate===TODAY&&!t.astart)t.astart=nowStr();
    saveDay();const y=window.scrollY;renderDaily();window.scrollTo(0,y);break}
  case'det':{const t=day.tasks.find(x=>x.id===row.dataset.id);if(!t)break;rowOpen[t.id]=!isOpen(t);const y=window.scrollY;renderDaily();window.scrollTo(0,y);break}
  case'unblock':{const t=day.tasks.find(x=>x.id===row.dataset.id);if(t){t.block='';saveDay();renderDaily()}break}
  case'routine-toggle':{const l=day.tasks.filter(t=>t.slot===el.dataset.slot),any=l.some(isOpen);l.forEach(t=>rowOpen[t.id]=!any);const y=window.scrollY;renderDaily();window.scrollTo(0,y);break}
  case'rec-toggle':recOpen=!recOpen;uiSet('recOpen',recOpen);renderWeekly();break;
  case'print':window.print();break;
  case'cloud-test':{(async()=>{
    if(!(window._fb&&window._fb.ready)){alert('Cloud sync is OFF.\n\nFirebase did not load: '+(window._fbErr||'unknown reason (blocked network or ad-blocker?)'));return}
    try{const v='t'+Date.now();await window._fb.set('syd/_test',{v});const r=await window._fb.get('syd/_test');
      if(r&&r.v===v){setSync('ok');alert('Cloud sync WORKS ✓\nWrote and read back from your Firebase database.')}else alert('Wrote to Firebase but could not read it back.\nCheck the database Rules (.read must be true).')}
    catch(e){alert('Cloud sync FAILED.\n\nError: '+((e&&(e.code||e.message))||e)+'\n\nMost likely the database Rules block access. They should be: .read true and .write true.')}})();break}
  case'end-day':flush();loadDay(addDays(curDate,1));break;
  case'del':{const i=day.tasks.findIndex(x=>x.id===row.dataset.id);if(i<0)break;const t=day.tasks[i];lastDel={t,i,dis:!!t.recId};
    if(t.recId&&!day.dismissed.includes(t.recId))day.dismissed.push(t.recId);day.tasks.splice(i,1);saveDay();const y=window.scrollY;renderDaily();window.scrollTo(0,y);toast('Task deleted',true);break}
  case'undo-del':{if(!lastDel)break;const d=lastDel;lastDel=null;if(d.dis)day.dismissed=day.dismissed.filter(x=>x!==d.t.recId);day.tasks.splice(Math.min(d.i,day.tasks.length),0,d.t);saveDay();renderDaily();$('#toast').style.display='none';break}
  case'up':case'down':{const x=rowIdx();if(!x)break;const j=x.i+(a==='up'?-1:1);if(j<0||j>=x.r.list.length)break;
    const L=x.r.list;[L[x.i],L[j]]=[L[j],L[x.i]];x.r.save();render();break}
  case'mood':{day.mood=day.mood===el.dataset.m?'':el.dataset.m;saveDay();renderDaily();break}
  case'collapse':{const id=el.closest('[data-sec]').dataset.sec;collapsed[id]=!collapsed[id];renderDaily();break}
  case'add-section':{const n=prompt('Section name?');if(n&&n.trim()){settings.sections.push({id:'s'+uid(),label:n.trim(),custom:true});saveSettings();renderDaily()}break}
  case'del-section':{const id=el.closest('[data-sec]').dataset.sec;if(confirm('Remove this section? Its tasks move to Personal Tasks.')){day.tasks.forEach(t=>{if(t.group===id)t.group='personal'});settings.sections=settings.sections.filter(s=>s.id!==id);saveSettings();saveDay();renderDaily()}break}
  case'add-block':{const n=prompt('Block label (e.g. 6a–9a)?');if(n&&n.trim()){settings.blocks.push({id:'b'+uid(),label:n.trim(),note:'',custom:true});saveSettings();renderDaily()}break}
  case'del-block':{const id=el.closest('[data-bk]').dataset.bk;day.tasks.forEach(t=>{if(t.slot===id)t.slot='sec';if(t.block===id)t.block=''});settings.blocks=settings.blocks.filter(b=>b.id!==id);saveSettings();saveDay();renderDaily();break}
  case'drop':{const i=+el.dataset.i;day.water=day.water===i?i-1:i;saveDay();renderDaily();break}
  case'water-goal':{const n=parseInt(prompt('How many glasses per day?',settings.waterGoal));if(n>0&&n<=30){settings.waterGoal=n;saveSettings();renderDaily()}break}
  case'meal-time':{const m=el.dataset.m,t=prompt('Edit time for '+m+':',settings.mealTimes[m]);if(t){settings.mealTimes[m]=t;saveSettings();renderDaily()}break}
  case'evdone':{const ev=cal.events.find(x=>x.id===el.dataset.id);if(ev){const s=new Set(ev.doneDates);s.has(curDate)?s.delete(curDate):s.add(curDate);ev.doneDates=[...s];saveCal();renderDaily()}break}
  case'sug-add':{const r=rec.list.find(x=>x.id===el.dataset.id);if(r){bookmarkRec(r);saveDay();renderDaily()}break}
  case'sug-skip':{day.dismissed.push(el.dataset.id);saveDay();renderDaily();break}
  case'sug-all':{suggested().forEach(bookmarkRec);saveDay();renderDaily();break}
  case'carry-add':{const c=carryItems()[+el.dataset.i];if(c){day.tasks.push(mk({t:c.t,group:c.group}));saveDay();renderDaily()}break}
  case'carry-del':{const c=carryItems()[+el.dataset.i];if(c){delCarry([c]);renderDaily();toast('Deleted')}break}
  case'carry-hide-all':{carryItems().forEach(c=>day.hiddenCarry.push(c.t.trim().toLowerCase()));saveDay();renderDaily();break}
  case'carry-all':{carryItems().forEach(c=>day.tasks.push(mk({t:c.t,group:c.group})));saveDay();renderDaily();break}
  case'goal-day':{const it=$('#dw-item').value;if(!it){toast('Pick a category and item first');break}
    day.tasks.push(mk({t:it,group:'well',start:$('#dw-time').value.trim(),note:$('#dw-dur').value.trim()}));saveDay();renderDaily();break}
  /* repeat modal */
  case'repeat':openRepeat(row.dataset.id);break;
  case'rep-day':{const d=+el.dataset.d;rep.days=rep.days.includes(d)?rep.days.filter(x=>x!==d):[...rep.days,d];drawRep();break}
  case'rep-preset':rep.days=el.dataset.p==='all'?[0,1,2,3,4,5,6]:[1,2,3,4,5];drawRep();break;
  case'rep-cancel':$('#rep-modal').classList.remove('open');rep=null;break;
  case'rep-stop':{const t=day.tasks.find(x=>x.id===rep.taskId);rec.list=rec.list.filter(x=>x.id!==rep.recId);if(t)delete t.recId;saveRec();saveDay();$('#rep-modal').classList.remove('open');rep=null;renderDaily();toast('Stopped repeating');break}
  case'rep-save':{if(!rep.days.length){toast('Pick at least one day');break}
    const t=day.tasks.find(x=>x.id===rep.taskId);if(!t)break;
    if(rep.recId){const r=rec.list.find(x=>x.id===rep.recId);if(r){r.days=rep.days.slice();saveRec()}}
    else{const g=isRoutine(t.slot)?t.slot:(settings.sections.some(s=>s.id===t.group)?t.group:'personal');
      const r=newRec({name:t.t,time:t.start||'',group:g,msb:t.msb||'mind',days:rep.days.slice()});t.recId=r.id}
    saveDay();$('#rep-modal').classList.remove('open');rep=null;renderDaily();toast('Repeating — edit it any time in Weekly');break}
  /* weekly */
  case'chip':{const d=+el.dataset.d;recForm.days=recForm.days.includes(d)?recForm.days.filter(x=>x!==d):[...recForm.days,d];el.classList.toggle('on');break}
  case'chip-preset':recForm.days=[0,1,2,3,4,5,6];renderWeekly();break;
  case'rec-add':{const n=$('#rc-name').value.trim();if(!n||!recForm.days.length){toast('Add a name and pick at least one day');break}
    newRec({name:n,time:$('#rc-time').value.trim(),group:$('#rc-group').value,msb:$('#rc-msb').value,days:recForm.days.slice(),until:$('#rc-until').value,start:TODAY});recForm={days:[]};renderWeekly();toast('Added');break}
  case'rec-day':{const r=rec.list.find(x=>x.id===row.dataset.id),d=+el.dataset.d,ds=arr(r.days).map(Number);r.days=ds.includes(d)?ds.filter(x=>x!==d):[...ds,d];saveRec();renderWeekly();break}
  case'rec-del':{rec.list=rec.list.filter(x=>x.id!==row.dataset.id);saveRec();renderWeekly();break}
  case'wk-prev':weekStart=addDays(weekStart,-7);renderWeekly();break;
  case'wk-next':weekStart=addDays(weekStart,7);renderWeekly();break;
  case'wk-today':weekStart=addDays(TODAY,-parse(TODAY).getDay());renderWeekly();break;
  case'goto':loadDay(el.dataset.d).then(()=>showTab('daily'));break;
  /* monthly */
  case'mo-prev':mon.m--;if(mon.m<0){mon.m=11;mon.y--}renderMonthly();break;
  case'mo-next':mon.m++;if(mon.m>11){mon.m=0;mon.y++}renderMonthly();break;
  case'mo-today':mon={y:parse(TODAY).getFullYear(),m:parse(TODAY).getMonth()};selDate=TODAY;renderMonthly();break;
  case'mo-sel':selDate=el.dataset.d;renderMonthly();break;
  case'ev-add':{const t=$('#ev-title').value.trim();if(!t)break;
    cal.events.push({id:uid(),title:t,time:$('#ev-time').value.trim(),cat:$('#ev-cat').value,notes:$('#ev-notes').value,date:selDate,repeat:$('#ev-rep').value,doneDates:[]});saveCal();renderMonthly();break}
  case'ev-del':{cal.events=cal.events.filter(x=>x.id!==row.dataset.id);saveCal();renderMonthly();break}
  case'cat-add':{const n=$('#cat-new').value.trim();if(n&&!cal.cats.includes(n)){cal.cats.push(n);saveCal();renderMonthly()}break}
  /* wellness */
  case'symp':{const s=el.dataset.s,l=day.well.symptoms;day.well.symptoms=l.includes(s)?l.filter(x=>x!==s):[...l,s];saveDay();renderWellness();break}
  case'wadd':{const ar=el.closest('.add-row'),v=ar.querySelector('input').value.trim(),L=ar.dataset.list;if(!v)break;
    if(L==='goal')well.goals.push({id:uid(),name:v});
    else if(L==='workout')well.workouts.push({id:uid(),date:curDate,type:v,mins:''});
    else if(L==='book')well.books.push({id:uid(),title:v,status:'To read',format:'Paperback'});
    else if(L==='bucket')well.bucket.push({id:uid(),title:v,done:false,subs:[]});
    else if(L==='place')well.places.push({id:uid(),name:v,type:$('#place-type').value,visited:false,notes:''});
    else if(L.startsWith('sub:')){const b=well.bucket.find(x=>x.id===L.slice(4));b.subs.push({id:uid(),t:v,count:0})}
    saveWell();renderWellness();break}
  case'wdel':{const x=rowIdx();if(x){x.r.list.splice(x.i,1);x.r.save();renderWellness()}break}
  case'bucket-chk':{const b=well.bucket.find(x=>x.id===row.dataset.id);b.done=!b.done;saveWell();renderWellness();break}
  case'place-chk':{const p=well.places.find(x=>x.id===row.dataset.id);p.visited=!p.visited;saveWell();renderWellness();break}
  case'goal-day2':{const g=well.goals.find(x=>x.id===row.dataset.id);if(g){day.tasks.push(mk({t:g.name,group:'well'}));saveDay();toast('Added to today')}break}
  case'bucket-day':{const b=well.bucket.find(x=>x.id===row.dataset.id);if(b){day.tasks.push(mk({t:b.title,group:'well'}));saveDay();toast('Added to today')}break}
  case'place-day':{const p=well.places.find(x=>x.id===row.dataset.id);if(p){day.tasks.push(mk({t:p.name,group:'well'}));saveDay();toast('Added to today')}break}
  case'sub-inc':{const r=rowItem(row);r.it.count=(r.it.count||0)+1;r.save();renderWellness();break}
  case'sub-del':{const r=rowItem(row);r.list.splice(r.list.indexOf(r.it),1);r.save();renderWellness();break}
  case'type-add':{const n=$('#type-new').value.trim();if(n&&!well.placeTypes.includes(n)){well.placeTypes.push(n);saveWell();renderWellness()}break}
  }
});

/* ---------- boot ---------- */
async function boot(){
  if(!(window._fb&&window._fb.ready)){await new Promise(r=>{const t=setTimeout(r,4500);window.addEventListener('fb-ready',()=>{clearTimeout(t);r()},{once:true})})}
  const sRaw=store.get(K.settings);
  settings=normSettings(await store.load(K.settings));
  if(!(sRaw&&sRaw.v>=2))saveSettings();
  well=normWell(await store.load(K.well));
  cal=normCal(await store.load(K.cal));
  const r=await store.load(K.rec);rec={list:arr(r&&r.list)};rec.list.forEach(x=>x.days=arr(x.days));
  await loadDay(TODAY)}
boot();
</script>
</body>
</html>
